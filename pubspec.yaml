name: banana_player
description: "An ExoPlayer and AVPlayer wrapper library for Flutter projects"
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.cavernlabs.banana.player.banana_player
        pluginClass: BananaPlayerPlugin
      ios:
        pluginClass: BananaPlayerPlugin
