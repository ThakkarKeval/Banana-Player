name: banana_player
description: "A high-performance video player for Flutter using ExoPlayer (Media3) on Android and AVPlayer on iOS with HLS, custom seekbars, and quality selection."
version: 0.0.1
repository: https://github.com/ThakkarKeval/Banana-Player
issue_tracker: https://github.com/ThakkarKeval/Banana-Player/issues

topics:
  - video-player
  - media
  - exoplayer
  - avplayer
  - hls

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.cavernlabs.banana.player.banana_player
        pluginClass: BananaPlayerPlugin
      ios:
        pluginClass: BananaPlayerPlugin
